<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sai Rithwik Kukunuri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Serif+Display:ital@0;1&family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --cream: #F5F0E8;
      --ink: #07080D;
      --warm-mid: #B8A06A;
      --accent-gold: #FFC627;
      --accent-maroon: #8C1D40;
      --glass: rgba(245,240,232,0.06);
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--ink);
      font-family: 'Outfit', sans-serif;
      cursor: none;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    .cursor {
      position: fixed; z-index: 9999;
      width: 12px; height: 12px;
      background: var(--accent-gold);
      border-radius: 50%;
      pointer-events: none;
      transition: transform 0.15s ease, background 0.2s;
      transform: translate(-50%, -50%);
    }
    .cursor-ring {
      position: fixed; z-index: 9998;
      width: 36px; height: 36px;
      border: 1.5px solid var(--accent-gold);
      border-radius: 50%;
      pointer-events: none;
      transition: transform 0.35s ease, width 0.2s, height 0.2s, border-color 0.2s;
      transform: translate(-50%, -50%);
      opacity: 0.5;
    }

    #bg-canvas {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      display: block;
    }

    .noise {
      position: fixed; inset: 0; z-index: 1;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      pointer-events: none;
    }

    .landing-nav {
      position: fixed;
      top: 1rem;
      left: 50%;
      width: min(calc(100% - 3rem), 1080px);
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.42rem 0.5rem 0.42rem 0.85rem;
      border: 1px solid rgba(245,240,232,0.1);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(18,19,24,0.76), rgba(7,8,13,0.54));
      backdrop-filter: blur(18px) saturate(135%);
      box-shadow: 0 18px 55px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.06);
      transform: translateX(-50%);
    }
    .landing-brand,
    .landing-nav-link {
      text-decoration: none;
      cursor: none;
      transition: color 0.2s, background 0.2s, box-shadow 0.2s, transform 0.2s;
    }
    .landing-brand {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--cream);
      white-space: nowrap;
    }
    .landing-brand::before {
      content: '';
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: var(--accent-gold);
      box-shadow: 0 0 18px rgba(255,198,39,0.56);
    }
    .landing-nav-links {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.2rem;
      min-width: 0;
      padding: 0.2rem;
      border: 1px solid rgba(245,240,232,0.07);
      border-radius: 999px;
      background: rgba(255,255,255,0.035);
    }
    .landing-nav-link {
      font-family: 'Space Mono', monospace;
      font-size: 0.62rem;
      text-transform: uppercase;
      color: rgba(245,240,232,0.62);
      padding: 0.48rem 0.78rem;
      border-radius: 999px;
      white-space: nowrap;
    }
    .landing-brand:hover,
    .landing-nav-link:hover {
      color: var(--accent-gold);
    }
    .landing-nav-link.active {
      color: #07080D;
      background: var(--accent-gold);
      box-shadow: 0 8px 24px rgba(255,198,39,0.25);
    }
    .landing-nav-toggle {
      display: none;
      width: 2.65rem;
      height: 2.25rem;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0.28rem;
      border: 1px solid rgba(245,240,232,0.16);
      border-radius: 999px;
      background: rgba(255,255,255,0.045);
      color: var(--cream);
      cursor: none;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .landing-nav-toggle span {
      width: 1.05rem;
      height: 2px;
      border-radius: 999px;
      background: currentColor;
      transition: transform 0.2s, opacity 0.2s;
    }
    .landing-nav-toggle:hover {
      color: var(--accent-gold);
      border-color: var(--accent-gold);
    }
    .landing-nav.is-open .landing-nav-toggle span:nth-child(1) {
      transform: translateY(6px) rotate(45deg);
    }
    .landing-nav.is-open .landing-nav-toggle span:nth-child(2) {
      opacity: 0;
    }
    .landing-nav.is-open .landing-nav-toggle span:nth-child(3) {
      transform: translateY(-6px) rotate(-45deg);
    }

    #landing {
      position: relative; z-index: 2;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 1rem 1rem 1rem clamp(2rem, 11vw, 9rem);
      overflow: hidden;
    }

    .hero-layout {
      width: min(1120px, 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: clamp(2rem, 6vw, 5.5rem);
    }

    .hero-stack {
      min-width: 0;
      flex: 0 1 760px;
    }

    /* === HERO TEXT === */
    .hero-text {
      text-align: left;
      width: 100%;
      opacity: 0; transform: translateY(40px);
      transition: opacity 0.9s 0.5s, transform 0.9s 0.5s;
    }
    .hero-text.visible { opacity: 1; transform: translateY(0); }

    .hero-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3.4rem, 8vw, 8rem);
      letter-spacing: 0.06em;
      line-height: 0.95;
      color: var(--cream);
      text-shadow: 0 0 60px rgba(255,198,39,0.14);
    }
    .hero-name span {
      display: block;
      color: var(--accent-gold);
    }

    .hero-sub {
      font-family: 'Space Mono', monospace;
      font-size: 0.68rem;
      color: var(--warm-mid);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-top: 0.5rem;
      overflow-wrap: anywhere;
    }

    .hero-college {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      max-width: min(100%, 680px);
      margin-top: 0.8rem;
      padding: 0.55rem 0.85rem;
      border-left: 2px solid var(--accent-gold);
      border-radius: 0 12px 12px 0;
      background: linear-gradient(90deg, rgba(255,198,39,0.075), rgba(255,198,39,0.018));
      backdrop-filter: blur(10px);
    }
    .hero-college .dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--accent-gold);
      animation: pulse 2s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }
    .hero-college span {
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem;
      color: rgba(245,240,232,0.76);
      letter-spacing: 0.08em;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .hero-tagline {
      margin-top: 0.65rem;
      font-size: 0.85rem;
      font-style: italic;
      color: var(--warm-mid);
    }

    .hero-photo {
      position: relative;
      width: clamp(215px, 20vw, 315px);
      aspect-ratio: 0.78;
      flex: 0 0 auto;
      opacity: 0;
      transform: translateY(36px) rotate(0.8deg);
      transition: opacity 0.9s 0.65s, transform 0.9s 0.65s;
    }
    .hero-photo.visible {
      opacity: 1;
      transform: translateY(0) rotate(0.8deg);
    }
    .hero-photo::before {
      content: '';
      position: absolute;
      inset: -1px;
      border: 1px solid rgba(255,198,39,0.24);
      border-radius: 18px;
      transform: rotate(-2.2deg);
      box-shadow: 0 0 80px rgba(255,198,39,0.1);
    }
    .hero-photo::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 18px;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 18%, rgba(255,198,39,0.08), transparent 42%),
        linear-gradient(180deg, rgba(7,8,13,0.05), rgba(7,8,13,0.26));
      mix-blend-mode: multiply;
    }
    .hero-photo img {
      position: relative;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 26%;
      display: block;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.08);
      filter: saturate(0.72) contrast(1.06) brightness(0.9);
      box-shadow: 0 28px 90px rgba(0,0,0,0.35);
    }

    .hero-actions {
      display: flex;
      gap: 0.8rem;
      margin-top: 1.15rem;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.9s 1.1s, transform 0.9s 1.1s;
    }
    .hero-actions.visible { opacity: 1; transform: translateY(0); }

    .hero-link {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.72rem 1rem;
      border: 1px solid rgba(255,198,39,0.38);
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(255,198,39,0.18), rgba(255,198,39,0.08));
      backdrop-filter: blur(14px);
      cursor: none;
      text-decoration: none;
      overflow: hidden;
      font-family: 'Space Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--accent-gold);
      box-shadow: 0 12px 34px rgba(255,198,39,0.08);
      transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s, background 0.3s, gap 0.3s;
    }
    .hero-link::before {
      content: '';
      position: absolute; inset: 0;
      opacity: 0; transition: opacity 0.4s;
      border-radius: inherit;
      background: radial-gradient(circle at 50% 100%, rgba(255,198,39,0.14), transparent 70%);
    }
    .hero-link:hover {
      gap: 0.75rem;
      transform: translateY(-3px);
      border-color: rgba(255,198,39,0.62);
      background: linear-gradient(135deg, rgba(255,198,39,0.24), rgba(255,198,39,0.1));
      box-shadow: 0 18px 46px rgba(255,198,39,0.16);
    }
    .hero-link:hover::before { opacity: 1; }
    .hero-link span {
      position: relative;
      overflow-wrap: anywhere;
    }

    @media (hover: none), (pointer: coarse) {
      html,
      body,
      .landing-brand,
      .landing-nav-link,
      .landing-nav-toggle,
      .hero-link {
        cursor: auto;
      }
      .cursor,
      .cursor-ring {
        display: none;
      }
    }

    .scroll-hint {
      position: fixed; bottom: 1.2rem; left: 50%;
      transform: translateX(-50%);
      font-family: 'Space Mono', monospace;
      font-size: 0.55rem; letter-spacing: 0.25em;
      color: rgba(140,115,85,0.4);
      text-transform: uppercase;
      animation: fadeUpDown 2s ease-in-out infinite;
      z-index: 10;
    }
    @keyframes fadeUpDown {
      0%, 100% { opacity: 0.3; transform: translateX(-50%) translateY(0); }
      50%       { opacity: 0.7; transform: translateX(-50%) translateY(-5px); }
    }

    /* Small screen safety */
    @media (max-height: 750px) {
      .hero-name { font-size: clamp(3rem, 7vw, 6rem); }
      .hero-photo { width: clamp(190px, 20vw, 300px); }
    }

    @media (max-width: 900px) {
      #landing {
        align-items: flex-start;
      }
      .hero-layout {
        display: block;
      }
      .hero-photo {
        display: block;
        width: clamp(145px, 42vw, 230px);
        margin: 1.5rem auto 0;
      }
    }

    @media (max-width: 680px) {
      html,
      body {
        height: auto;
        min-height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
      }
      .landing-nav {
        top: 0.75rem;
        width: calc(100% - 1.5rem);
        align-items: center;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 0.55rem;
        padding: 0.7rem;
        border-radius: 20px;
      }
      .landing-nav-toggle {
        display: inline-flex;
        margin-left: auto;
      }
      .landing-nav-links {
        width: 100%;
        display: none;
        flex-direction: column;
        align-items: stretch;
        gap: 0.25rem;
        padding: 0.35rem;
        border-radius: 16px;
      }
      .landing-nav.is-open .landing-nav-links {
        display: flex;
      }
      .landing-nav-link {
        width: 100%;
        font-size: 0.58rem;
        padding: 0.68rem 0.85rem;
      }
      #landing {
        min-height: 100svh;
        align-items: flex-start;
        justify-content: center;
        padding-top: 6.8rem;
        padding-bottom: 2.5rem;
        padding-left: 1.25rem;
        padding-right: 1.25rem;
        overflow: visible;
      }
      .hero-text { width: 100%; }
      .hero-name { font-size: clamp(3rem, 16vw, 5.4rem); }
      .hero-sub { font-size: 0.58rem; letter-spacing: 0.16em; line-height: 1.6; }
      .hero-college {
        align-items: flex-start;
        padding: 0.55rem 0.75rem;
      }
      .hero-link { width: 100%; justify-content: center; }
      .hero-photo {
        width: clamp(132px, 44vw, 190px);
        margin-top: 1.25rem;
      }
    }

    @media (max-width: 380px) {
      .landing-nav {
        width: calc(100% - 1rem);
      }
      #landing {
        padding-left: 0.9rem;
        padding-right: 0.9rem;
      }
      .hero-name {
        font-size: clamp(2.7rem, 16vw, 4.5rem);
      }
      .hero-college {
        gap: 0.5rem;
      }
    }
  </style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursor-ring"></div>
<canvas id="bg-canvas"></canvas>
<div class="noise"></div>

<nav class="landing-nav" aria-label="Primary navigation">
  <a href="#landing" class="landing-brand">Sai Rithwik K.</a>
  <button class="landing-nav-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false">
    <span></span>
    <span></span>
    <span></span>
  </button>
  <div class="landing-nav-links">
    <a href="#landing" class="landing-nav-link active">Home</a>
    <a href="ml.html#projects" class="landing-nav-link">Projects</a>
    <a href="assets/Sai_Rithwik_Kukunuri_Resume.pdf" target="_blank" rel="noopener" class="landing-nav-link">Resume</a>
    <a href="ml.html#contact" class="landing-nav-link">Contact</a>
  </div>
</nav>

<section id="landing">

  <div class="hero-layout">
    <div class="hero-stack">
      <div class="hero-text" id="hero-text">
        <div class="hero-name">
          SAI RITHWIK<span>KUKUNURI</span>
        </div>
        <div class="hero-sub">Software Engineer · ML &amp; Data Engineering · Machine Learning Builder</div>
        <div class="hero-college">
          <div class="dot"></div>
          <span>Arizona State University · CS · Data Science Minor · BS '27</span>
        </div>
      </div>

      <div class="hero-actions" id="hero-actions">
        <a href="ml.html" class="hero-link"><span>Explore Engineering Portfolio →</span></a>
      </div>
    </div>

    <div class="hero-photo" id="hero-photo">
      <img src="assets/image.png" alt="Sai Rithwik Kukunuri" />
    </div>
  </div>

</section>

<div class="scroll-hint">↑ enter portfolio ↑</div>

<script>

  const landingNav = document.querySelector('.landing-nav');
  const landingNavToggle = document.querySelector('.landing-nav-toggle');

  if (landingNav && landingNavToggle) {
    landingNavToggle.addEventListener('click', () => {
      const isOpen = landingNav.classList.toggle('is-open');
      landingNavToggle.setAttribute('aria-expanded', String(isOpen));
      landingNavToggle.setAttribute('aria-label', isOpen ? 'Close navigation menu' : 'Open navigation menu');
    });

    landingNav.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        landingNav.classList.remove('is-open');
        landingNavToggle.setAttribute('aria-expanded', 'false');
        landingNavToggle.setAttribute('aria-label', 'Open navigation menu');
      });
    });
  }

  // ── CURSOR ─────────────────────────────────────────────────────
  const cursor = document.getElementById('cursor');
  const ring   = document.getElementById('cursor-ring');
  let mx = 0, my = 0, rx = 0, ry = 0;
  document.addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    cursor.style.left = mx + 'px'; cursor.style.top = my + 'px';
  });
  (function animRing() {
    rx += (mx - rx) * 0.12; ry += (my - ry) * 0.12;
    ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
    requestAnimationFrame(animRing);
  })();
  document.querySelectorAll('a, .hero-link').forEach(el => {
    el.addEventListener('mouseenter', () => { cursor.style.transform = 'translate(-50%,-50%) scale(2)'; ring.style.width = '60px'; ring.style.height = '60px'; });
    el.addEventListener('mouseleave', () => { cursor.style.transform = 'translate(-50%,-50%) scale(1)'; ring.style.width = '36px'; ring.style.height = '36px'; });
  });

  // ── BACKGROUND CANVAS ─────────────────────────────────────────
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, dpr;

  function resizeCanvas() {
    dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  const accent = '#FFC627';
  const hr = parseInt(accent.slice(1, 3), 16);
  const hg = parseInt(accent.slice(3, 5), 16);
  const hb = parseInt(accent.slice(5, 7), 16);

  let mouseX = W / 2;
  let mouseY = H / 2;
  let t = 0;

  document.addEventListener('mousemove', e => {
    mouseX = e.clientX;
    mouseY = e.clientY;
  });

  function drawBackground() {
    const ox = (mouseX / W - 0.5) * 10;
    const oy = (mouseY / H - 0.5) * 10;

    const base = ctx.createLinearGradient(0, 0, W, H);
    base.addColorStop(0, '#06080D');
    base.addColorStop(0.5, '#11100F');
    base.addColorStop(1, '#07090E');
    ctx.fillStyle = base;
    ctx.fillRect(0, 0, W, H);

    drawGrid(t);
    drawAmbientGlows(ox, oy, t);
    drawGlassBlobs(ox, oy, t);
    drawSoftSweep(t);
    drawVignette();

    t += 0.018;
    requestAnimationFrame(drawBackground);
  }

  function drawGrid(time) {
    const spacing = 112;
    const offset = (time * 12) % spacing;
    ctx.strokeStyle = `rgba(${hr},${hg},${hb},0.014)`;
    ctx.lineWidth = 1;
    for (let x = -spacing + offset; x <= W + spacing; x += spacing) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
    }
    for (let y = -spacing + offset * 0.65; y <= H + spacing; y += spacing) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
  }

  function drawAmbientGlows(ox, oy, time) {
    const breathe = 0.5 + 0.5 * Math.sin(time * 1.35);
    const driftX = Math.sin(time * 1.05) * 115;
    const driftY = Math.cos(time * 0.82) * 82;

    const goldGlow = ctx.createRadialGradient(
      W * 0.68 + ox + driftX, H * 0.42 + oy + driftY, 0,
      W * 0.68 + ox + driftX, H * 0.42 + oy + driftY, Math.max(W, H) * 0.56
    );
    goldGlow.addColorStop(0, `rgba(${hr},${hg},${hb},${0.16 + breathe * 0.045})`);
    goldGlow.addColorStop(0.38, `rgba(${hr},${hg},${hb},0.07)`);
    goldGlow.addColorStop(1, `rgba(${hr},${hg},${hb},0)`);
    ctx.fillStyle = goldGlow;
    ctx.fillRect(0, 0, W, H);

    const maroonGlow = ctx.createRadialGradient(
      W * 0.12 - ox * 0.35 + Math.cos(time * 0.32) * 36, H * 0.84 - oy * 0.35, 0,
      W * 0.12 - ox * 0.35 + Math.cos(time * 0.32) * 36, H * 0.84 - oy * 0.35, Math.max(W, H) * 0.4
    );
    maroonGlow.addColorStop(0, 'rgba(140,29,64,0.16)');
    maroonGlow.addColorStop(0.5, 'rgba(140,29,64,0.055)');
    maroonGlow.addColorStop(1, 'rgba(140,29,64,0)');
    ctx.fillStyle = maroonGlow;
    ctx.fillRect(0, 0, W, H);
  }

  function drawGlassBlobs(ox, oy, time) {
    const blobs = [
      { x: 0.78, y: 0.28, r: 230, c: `rgba(${hr},${hg},${hb},`, p: 0.2 },
      { x: 0.9, y: 0.66, r: 170, c: 'rgba(140,29,64,', p: 2.1 },
      { x: 0.32, y: 0.78, r: 190, c: `rgba(${hr},${hg},${hb},`, p: 4.4 }
    ];

    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    blobs.forEach(blob => {
      const x = W * blob.x + Math.sin(time * 1.1 + blob.p) * 52 + ox * 0.6;
      const y = H * blob.y + Math.cos(time * 0.9 + blob.p) * 44 + oy * 0.6;
      const radius = blob.r + Math.sin(time * 1.2 + blob.p) * 18;

      const glow = ctx.createRadialGradient(x, y, 0, x, y, radius);
      glow.addColorStop(0, `${blob.c}0.18)`);
      glow.addColorStop(0.48, `${blob.c}0.06)`);
      glow.addColorStop(1, `${blob.c}0)`);
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = `${blob.c}0.14)`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(x, y, radius * 0.36, 0, Math.PI * 2);
      ctx.stroke();
    });
    ctx.restore();
  }

  function drawSoftSweep(time) {
    const y = H * 0.36 + Math.sin(time * 1.15) * 120;
    const sweep = ctx.createLinearGradient(0, y - 180, W, y + 180);
    sweep.addColorStop(0, `rgba(${hr},${hg},${hb},0)`);
    sweep.addColorStop(0.5, `rgba(${hr},${hg},${hb},0.085)`);
    sweep.addColorStop(1, `rgba(${hr},${hg},${hb},0)`);
    ctx.fillStyle = sweep;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.translate(W * 0.5, H * 0.5);
    ctx.rotate(-0.35);
    for (let i = 0; i < 3; i++) {
      const x = ((time * 180 + i * 340) % (W + 520)) - W * 0.5 - 260;
      const band = ctx.createLinearGradient(x - 140, -H, x + 140, H);
      band.addColorStop(0, `rgba(${hr},${hg},${hb},0)`);
      band.addColorStop(0.5, `rgba(${hr},${hg},${hb},0.04)`);
      band.addColorStop(1, `rgba(${hr},${hg},${hb},0)`);
      ctx.fillStyle = band;
      ctx.fillRect(x - 140, -H, 280, H * 2);
    }
    ctx.restore();
  }

  function drawVignette() {
    const vignette = ctx.createRadialGradient(W * 0.5, H * 0.5, Math.min(W, H) * 0.18, W * 0.5, H * 0.5, Math.max(W, H) * 0.72);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(0,0,0,0.5)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);
  }

  drawBackground();

  // ── ENTRANCE ───────────────────────────────────────────────────
  setTimeout(() => {
    document.getElementById('hero-text').classList.add('visible');
    document.getElementById('hero-photo').classList.add('visible');
    document.getElementById('hero-actions').classList.add('visible');
  }, 200);
</script>
